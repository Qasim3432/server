<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Withdrawals</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f7fa;
            --white: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;

            --green: #047857;
            --green-bg: #ecfdf5;

            --red: #b91c1c;
            --red-bg: #fef2f2;

            --orange: #b45309;
            --orange-bg: #fffbeb;

            --blue: #1d4ed8;
            --blue-bg: #eff6ff;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .page {
            max-width: 1250px;
            margin: auto;
            padding: 24px 18px 50px;
        }

        /* =========================
           HEADER
        ========================= */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .title-area h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .title-area p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .search {
            width: 300px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 15px;
            outline: none;
            color: var(--text);
        }

        .search:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .10);
        }


        /* =========================
           SUMMARY
        ========================= */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .summary-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 18px;
        }

        .summary-label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .summary-number {
            margin-top: 7px;
            font-size: 27px;
            font-weight: 800;
        }

        .summary-card.pending .summary-number {
            color: var(--orange);
        }

        .summary-card.approved .summary-number {
            color: var(--green);
        }

        .summary-card.rejected .summary-number {
            color: var(--red);
        }


        /* =========================
           MAIN PANEL
        ========================= */

        .panel {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .panel-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .panel-header span {
            color: var(--muted);
            font-size: 13px;
        }


        /* =========================
           DESKTOP TABLE
        ========================= */

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            text-align: left;
            padding: 13px 18px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        td {
            padding: 17px 18px;
            border-bottom: 1px solid #f0f1f3;
            vertical-align: middle;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }


        /* =========================
           USER
        ========================= */

        .user-name {
            font-weight: 750;
            color: var(--text);
        }

        .account-number {
            color: var(--muted);
            font-size: 12px;
            margin-top: 3px;
        }

        .method {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            background: #f1f5f9;
            color: #334155;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
        }


        /* =========================
           AMOUNTS
        ========================= */

        .amount {
            font-size: 16px;
            font-weight: 800;
            color: var(--red);
            white-space: nowrap;
        }

        .balance {
            font-weight: 750;
            color: var(--green);
        }

        .balance.insufficient {
            color: var(--red);
        }

        .warning {
            display: block;
            margin-top: 4px;
            color: var(--red);
            font-size: 11px;
            font-weight: 700;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
        }

        .status.pending {
            background: var(--orange-bg);
            color: var(--orange);
        }

        .status.approved {
            background: var(--green-bg);
            color: var(--green);
        }

        .status.rejected {
            background: var(--red-bg);
            color: var(--red);
        }


        /* =========================
           BUTTONS
        ========================= */

        .actions {
            display: flex;
            gap: 7px;
        }

        .btn {
            border: none;
            border-radius: 9px;
            padding: 9px 13px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: .15s ease;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .approve {
            background: #059669;
            color: white;
        }

        .approve:hover:not(:disabled) {
            background: #047857;
        }

        .reject {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        .reject:hover:not(:disabled) {
            background: #be123c;
            color: white;
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .processed {
            color: #9ca3af;
            font-size: 12px;
            font-weight: 600;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {
            text-align: center;
            padding: 55px 20px;
        }

        .empty-icon {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .empty-title {
            font-weight: 800;
            font-size: 16px;
        }

        .empty-text {
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }


        /* =========================
           TOAST
        ========================= */

        #toastContainer {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 5000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #111827;
            color: white;
            padding: 13px 16px;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,.18);
            animation: toastIn .2s ease;
        }

        .toast.success {
            background: #047857;
        }

        .toast.error {
            background: #b91c1c;
        }

        @keyframes toastIn {
            from {
                transform: translateY(10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }


        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 4000;

            opacity: 0;
            visibility: hidden;
            transition: .18s ease;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 430px;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 25px 60px rgba(0,0,0,.25);
            transform: scale(.97);
            transition: .18s ease;
        }

        .modal.active .modal-box {
            transform: scale(1);
        }

        .modal-icon {
            width: 48px;
            height: 48px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff7ed;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 850;
            margin: 0;
        }

        .modal-text {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin: 8px 0 22px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
        }

        .cancel {
            background: #f1f5f9;
            color: #334155;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .page {
                padding: 18px 12px 40px;
            }

            .topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .title-area h1 {
                font-size: 25px;
            }

            .search {
                width: 100%;
                max-width: none;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .panel-header {
                padding: 16px;
            }

            .table-wrap {
                overflow: visible;
            }

            table,
            tbody,
            tr,
            td {
                display: block;
                width: 100%;
            }

            thead {
                display: none;
            }

            tbody {
                padding: 10px;
            }

            tbody tr {
                background: white;
                border: 1px solid var(--border);
                border-radius: 14px;
                margin-bottom: 12px;
                padding: 4px 0;
                overflow: hidden;
            }

            tbody tr:hover {
                background: white;
            }

            td {
                border: none;
                padding: 9px 14px;
            }

            td::before {
                display: block;
                color: #94a3b8;
                font-size: 10px;
                font-weight: 800;
                text-transform: uppercase;
                margin-bottom: 3px;
                letter-spacing: .04em;
            }

            td:nth-child(1)::before {
                content: "Player";
            }

            td:nth-child(2)::before {
                content: "Payment Method";
            }

            td:nth-child(3)::before {
                content: "Account";
            }

            td:nth-child(4)::before {
                content: "Withdrawal";
            }

            td:nth-child(5)::before {
                content: "Available Balance";
            }

            td:nth-child(6)::before {
                content: "Status";
            }

            td:nth-child(7)::before {
                content: "Action";
            }

            .actions {
                width: 100%;
            }

            .actions .btn {
                flex: 1;
                padding: 11px;
            }

            .modal-actions {
                flex-direction: column-reverse;
            }
        }
    </style>
</head>

<body>

<div id="toastContainer"></div>


<div class="page">

    <!-- HEADER -->
    <header class="topbar">

        <div class="title-area">

            <h1>
                Withdrawals
            </h1>

            <p>
                Review and process player withdrawal requests.
            </p>

        </div>


        <input
            type="text"
            id="dashboardSearch"
            class="search"
            placeholder="Search player, account or method..."
            onkeyup="filterTable()"
        >

    </header>


    <!-- SUMMARY -->
    <div class="summary-grid">

        <div class="summary-card pending">

            <div class="summary-label">
                Pending Requests
            </div>

            <div
                class="summary-number"
                id="pendingCount">
                —
            </div>

        </div>


        <div class="summary-card approved">

            <div class="summary-label">
                Approved
            </div>

            <div
                class="summary-number"
                id="approvedCount">
                —
            </div>

        </div>


        <div class="summary-card rejected">

            <div class="summary-label">
                Rejected
            </div>

            <div
                class="summary-number"
                id="rejectedCount">
                —
            </div>

        </div>

    </div>


    <!-- REQUESTS -->
    <section class="panel">

        <div class="panel-header">

            <h2>
                Withdrawal Requests
            </h2>

            <span>
                Updates automatically
            </span>

        </div>


        <div
            class="table-wrap"
            id="tableContent">

            {% include 'withdrawal_table_partial.html' %}

        </div>

    </section>

</div>


<!-- CONFIRMATION MODAL -->
<div
    id="customModal"
    class="modal"
    onclick="if(event.target === this) closeConfirmationModal()">

    <div class="modal-box">

        <div class="modal-icon" id="modalIcon">
            💸
        </div>

        <h3
            class="modal-title"
            id="modalTitle">
            Confirm withdrawal
        </h3>

        <div
            class="modal-text"
            id="modalText">
            Are you sure you want to process this request?
        </div>


        <div class="modal-actions">

            <button
                type="button"
                class="btn cancel"
                onclick="closeConfirmationModal()">

                Cancel

            </button>


            <button
                type="button"
                class="btn approve"
                id="modalConfirmBtn">

                Confirm

            </button>

        </div>

    </div>

</div>


<script>

    /* =========================================
       SEARCH
    ========================================= */

    function filterTable() {

        const search =
            document
                .getElementById("dashboardSearch")
                .value
                .toLowerCase()
                .trim();

        const rows =
            document.querySelectorAll("#ledgerTable tbody tr");

        rows.forEach(row => {

            const text =
                row.innerText.toLowerCase();

            row.style.display =
                text.includes(search)
                    ? ""
                    : "none";

        });

    }


    /* =========================================
       UPDATE SUMMARY
    ========================================= */

    function updateSummary() {

        const rows =
            document.querySelectorAll("#ledgerTable tbody tr");

        let pending = 0;
        let approved = 0;
        let rejected = 0;

        rows.forEach(row => {

            const status =
                row.innerText.toUpperCase();

            if (status.includes("PENDING")) {
                pending++;
            }

            if (status.includes("APPROVED")) {
                approved++;
            }

            if (status.includes("REJECTED")) {
                rejected++;
            }

        });

        document.getElementById("pendingCount").innerText = pending;
        document.getElementById("approvedCount").innerText = approved;
        document.getElementById("rejectedCount").innerText = rejected;

    }


    /* =========================================
       CONFIRMATION
    ========================================= */

    function openConfirmationModal(url, type, amount) {

        const modal =
            document.getElementById("customModal");

        const title =
            document.getElementById("modalTitle");

        const text =
            document.getElementById("modalText");

        const icon =
            document.getElementById("modalIcon");

        const confirmBtn =
            document.getElementById("modalConfirmBtn");


        if (type === "approve") {

            icon.innerText = "💸";

            title.innerText =
                "Approve withdrawal?";

            text.innerText =
                `This will approve the withdrawal of ${amount} coins and deduct the amount from the player's balance.`;

            confirmBtn.className =
                "btn approve";

            confirmBtn.innerText =
                "Approve Withdrawal";

        } else {

            icon.innerText = "⚠️";

            title.innerText =
                "Reject withdrawal?";

            text.innerText =
                "This withdrawal request will be marked as rejected. The player's balance will not be deducted.";

            confirmBtn.className =
                "btn reject";

            confirmBtn.innerText =
                "Reject Withdrawal";

        }


        confirmBtn.onclick = function() {

            executeTransactionAction(url);

        };


        modal.classList.add("active");

    }


    function closeConfirmationModal() {

        document
            .getElementById("customModal")
            .classList.remove("active");

    }


    /* =========================================
       PROCESS REQUEST
    ========================================= */

    function executeTransactionAction(targetUrl) {

        if (!targetUrl) return;

        closeConfirmationModal();


        fetch(targetUrl, {

            method: "POST",

            headers: {

                "X-Requested-With":
                    "XMLHttpRequest",

                "X-CSRFToken":
                    "{{ csrf_token }}"

            }

        })

        .then(response => {

            if (!response.ok) {
                throw new Error("Request failed");
            }

            return response.json();

        })

        .then(data => {

            if (data.status === "success") {

                showToast(
                    data.message || "Request processed successfully.",
                    "success"
                );

                syncDashboardTableData();

            } else {

                showToast(
                    data.message || "Unable to process request.",
                    "error"
                );

            }

        })

        .catch(error => {

            console.error(error);

            showToast(
                "Unable to connect to the server.",
                "error"
            );

        });

    }


    /* =========================================
       TOAST
    ========================================= */

    function showToast(message, type) {

        const container =
            document.getElementById("toastContainer");

        const toast =
            document.createElement("div");

        toast.className =
            `toast ${type}`;

        toast.innerText =
            message;

        container.appendChild(toast);

        setTimeout(() => {

            toast.remove();

        }, 4000);

    }


    /* =========================================
       REFRESH
    ========================================= */

    function syncDashboardTableData() {

        fetch(window.location.href, {

            headers: {
                "X-Requested-With":
                    "XMLHttpRequest"
            }

        })

        .then(response => response.text())

        .then(html => {

            document
                .getElementById("tableContent")
                .innerHTML = html;

            filterTable();

            updateSummary();

        })

        .catch(error => {

            console.error(
                "Refresh failed:",
                error
            );

        });

    }


    /* =========================================
       ESC KEY
    ========================================= */

    document.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Escape") {
                closeConfirmationModal();
            }

        }
    );


    /* =========================================
       INITIAL LOAD
    ========================================= */

    updateSummary();


    /* Refresh every 5 seconds */
    setInterval(
        syncDashboardTableData,
        5000
    );

</script>

</body>
</html>
